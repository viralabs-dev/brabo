# O tema de cada ADR — e a lista fechada de temas (ADR 0202, AT-137).
#
# O tema mora AQUI, e não no ADR: ADR aceito NUNCA é editado, nem para ganhar
# frontmatter. `docs/adr/index.md` é agrupado por tema a partir deste arquivo,
# e `pnpm docs:check` (`scripts/docs/temas-de-adr.mjs`) reprova:
#   - ADR em `docs/adr/` sem tema aqui;
#   - tema citado em `adrs:` que não está em `temas:`;
#   - entrada em `adrs:` para ADR que não existe;
#   - tema da lista sem nenhum ADR;
#   - no índice: seção de tema ausente, fora da ordem desta lista, linha de ADR
#     sob a seção errada, fora de seção, repetida ou fora da ordem numérica.
#
# ADR novo: UMA linha em `adrs:` com UM tema (o principal — quando dois servem,
# vale aquele em que alguém procuraria primeiro), e a linha do índice na seção
# desse tema, em ordem numérica. Quem escreve o ADR propõe o tema; quem revisa
# o PR confirma. Tema NOVO é mudança desta lista, justificada no PR que o
# cria; passar de 15 temas exige ADR que revise o 0202.
#
# `titulo` é o cabeçalho da seção no índice (o índice está em inglês); `id` é a
# âncora (`{#tema-<id>}`) e o valor usado em `adrs:`.

temas:
  - id: git
    titulo: Git, repositório e política de branches
    descricao: O contrato do provider de git, o nascimento e a adoção do repositório, a proteção e a política de branches.
    i18n:
      en: {"titulo": "Git, repository and branch policy", "descricao": "The git provider contract, the repository's birth and adoption, protection and the branch policy."}
      ru: {"titulo": "Git, репозиторий и политика веток", "descricao": "Контракт git-провайдера, рождение и усыновление репозитория, защита и политика веток."}
      zh-Hans: {"titulo": "Git、仓库与分支策略", "descricao": "git provider 的契约、仓库的创建与采纳、分支的保护与策略。"}
  - id: agentes
    titulo: Harness de agente, turnos e sessões
    descricao: Como um agente roda — contexto, o laço de ferramentas, o turno conversacional, a sessão e seus estados.
    i18n:
      en: {"titulo": "Agent harness, turns and sessions", "descricao": "How an agent runs — context, the tool loop, the conversational turn, the session and its states."}
      ru: {"titulo": "Harness агента, ходы и сессии", "descricao": "Как работает агент — контекст, цикл инструментов, разговорный ход, сессия и её состояния."}
      zh-Hans: {"titulo": "智能体的 harness、回合与会话", "descricao": "一个智能体如何运行——上下文、工具循环、对话回合、会话及其状态。"}
  - id: time
    titulo: O time de agentes — papéis, áreas e handoffs
    descricao: Quais agentes existem, o que cada um entrega a quem, a delegação dentro de uma área e o handoff entre eles.
    i18n:
      en: {"titulo": "The agent team — roles, areas and handoffs", "descricao": "Which agents exist, what each delivers to whom, delegation inside an area and the handoff between them."}
      ru: {"titulo": "Команда агентов — роли, области и handoff", "descricao": "Какие агенты существуют, что каждый передаёт кому, делегирование внутри области и handoff между ними."}
      zh-Hans: {"titulo": "智能体团队——角色、领域与 handoffs", "descricao": "有哪些智能体，每个向谁交付什么，领域内部的委派，以及它们之间的 handoff。"}
  - id: gates
    titulo: Gates, QA e revisão de segurança
    descricao: O registro de gates, os vereditos de QA e SecOps e os golden-sets que os medem.
    i18n:
      en: {"titulo": "Gates, QA and security review", "descricao": "The gate registry, the QA and SecOps verdicts and the golden-sets that measure them."}
      ru: {"titulo": "Gates, QA и ревью безопасности", "descricao": "Реестр gates, вердикты QA и SecOps и golden-set, которые их измеряют."}
      zh-Hans: {"titulo": "Gates、QA 与安全审查", "descricao": "gates 的注册表、QA 和 SecOps 的裁决，以及衡量它们的 golden-sets。"}
  - id: execucao
    titulo: Execução, política de terminal e aprovações
    descricao: O dev agent trabalhando, `proposed_action`, a política de terminal, o escopo de caminho, o modo automático e os tetos absolutos.
    i18n:
      en: {"titulo": "Execution, terminal policy and approvals", "descricao": "The dev agent at work, `proposed_action`, the terminal policy, path scope, auto mode and the absolute ceilings."}
      ru: {"titulo": "Исполнение, политика терминала и одобрения", "descricao": "Работающий dev agent, `proposed_action`, политика терминала, область путей, автоматический режим и абсолютные потолки."}
      zh-Hans: {"titulo": "执行、终端策略与审批", "descricao": "工作中的 dev agent、`proposed_action`、终端策略、路径范围、自动模式和绝对上限。"}
  - id: modos
    titulo: Onde o código mora — modos de execução
    descricao: Os três modos de execução, a pasta do usuário, a base de projetos e a conversão de um projeto entre modos.
    i18n:
      en: {"titulo": "Where the code lives — execution modes", "descricao": "The three execution modes, the user's folder, the projects base and converting a project between modes."}
      ru: {"titulo": "Где живёт код — режимы исполнения", "descricao": "Три режима исполнения, папка пользователя, база проектов и перевод проекта между режимами."}
      zh-Hans: {"titulo": "代码住在哪里——执行模式", "descricao": "三种执行模式、用户的文件夹、项目的基目录，以及项目在模式之间的转换。"}
  - id: container
    titulo: Container do projeto e broker
    descricao: O ciclo de vida do container do projeto, a decisão de imagem, a porta de Docker e o broker que fala com o daemon.
    i18n:
      en: {"titulo": "Project container and broker", "descricao": "The project container's lifecycle, the image decision, the Docker port and the broker that talks to the daemon."}
      ru: {"titulo": "Контейнер проекта и broker", "descricao": "Жизненный цикл контейнера проекта, решение об образе, порт Docker и broker, который говорит с демоном."}
      zh-Hans: {"titulo": "项目容器与 broker", "descricao": "项目容器的生命周期、镜像的决定、Docker 端口，以及与守护进程对话的 broker。"}
  - id: runner
    titulo: O runner local
    descricao: O CLI na máquina do usuário — o canal, as credenciais, as chaves de dispositivo, a distribuição, a base e o serviço.
    i18n:
      en: {"titulo": "The local runner", "descricao": "The CLI on the user's machine — its channel, credentials, device keys, distribution, base and service."}
      ru: {"titulo": "Локальный runner", "descricao": "CLI на машине пользователя — канал, учётные данные, ключи устройства, распространение, база и служба."}
      zh-Hans: {"titulo": "本地 runner", "descricao": "用户机器上的 CLI——通道、凭据、设备密钥、分发、基目录和服务。"}
  - id: iam
    titulo: Autenticação, acesso e segredos
    descricao: Autenticação first-party, papéis e seus tetos, associação ao workspace, endurecimento entre origens e envelopes de segredo.
    i18n:
      en: {"titulo": "Auth, access and secrets", "descricao": "First-party auth, roles and their ceilings, workspace membership, cross-origin hardening and secret envelopes."}
      ru: {"titulo": "Аутентификация, доступ и секреты", "descricao": "Собственная аутентификация, роли и их потолки, членство в workspace, усиление защиты между источниками и конверты секретов."}
      zh-Hans: {"titulo": "认证、访问与秘密", "descricao": "first-party 认证、角色及其上限、workspace 成员关系、跨源加固以及秘密的信封。"}
  - id: llm
    titulo: Providers de LLM, modelos e gasto
    descricao: O contrato de provider, o catálogo de modelos e a curadoria, os bindings de modelo, o metering e os orçamentos.
    i18n:
      en: {"titulo": "LLM providers, models and spend", "descricao": "The provider contract, the model catalog and curation, model bindings, metering and budgets."}
      ru: {"titulo": "LLM-провайдеры, модели и расходы", "descricao": "Контракт провайдера, каталог моделей и курирование, binding моделей, metering и бюджеты."}
      zh-Hans: {"titulo": "LLM providers、模型与开销", "descricao": "provider 的契约、模型目录与人工筛选、模型的 bindings、计量和预算。"}
  - id: conhecimento
    titulo: RAG, grafo de conhecimento e artefatos
    descricao: Chunks e busca híbrida, a medição dela, o grafo Neo4j e os artefatos projetados do event log.
    i18n:
      en: {"titulo": "RAG, knowledge graph and artifacts", "descricao": "Chunks and hybrid search, its measurement, the Neo4j graph and the artifacts projected from the event log."}
      ru: {"titulo": "RAG, граф знаний и артефакты", "descricao": "Чанки и гибридный поиск, их измерение, граф Neo4j и артефакты, проецируемые из event log."}
      zh-Hans: {"titulo": "RAG、知识图谱与工件", "descricao": "chunks 和混合搜索、对它的测量、Neo4j 图谱，以及从事件日志投影出的工件。"}
  - id: web
    titulo: Interface web e design system
    descricao: Telas, navegação, temas e a estrutura dos maiores arquivos do app web.
    i18n:
      en: {"titulo": "Web UI and design system", "descricao": "Screens, navigation, themes and the structure of the web app's largest files."}
      ru: {"titulo": "Web-интерфейс и дизайн-система", "descricao": "Экраны, навигация, темы и структура самых больших файлов web-приложения."}
      zh-Hans: {"titulo": "Web 界面与设计系统", "descricao": "界面、导航、主题，以及 web 应用中最大文件的结构。"}
  - id: operacao
    titulo: Operação, deploy e instalação
    descricao: Imagens de produção, Kubernetes, observabilidade, backup, o compose de dev e o instalador de uma linha.
    i18n:
      en: {"titulo": "Operation, deploy and installation", "descricao": "Production images, Kubernetes, observability, backup, the dev compose and the one-line installer."}
      ru: {"titulo": "Эксплуатация, deploy и установка", "descricao": "Production-образы, Kubernetes, наблюдаемость, бэкап, dev-compose и установщик в одну строку."}
      zh-Hans: {"titulo": "运维、部署与安装", "descricao": "生产镜像、Kubernetes、可观测性、备份、dev 的 compose 以及一行安装程序。"}
  - id: engenharia
    titulo: CI, release e cadeia de suprimentos
    descricao: O pipeline, as imagens publicadas, a assinatura, a varredura, o pin, as camadas de teste e a estrutura do próprio repositório.
    i18n:
      en: {"titulo": "CI, release and supply chain", "descricao": "The pipeline, the published images, signing, scanning, pinning, the test layers and the repository's own structure."}
      ru: {"titulo": "CI, релиз и цепочка поставок", "descricao": "Конвейер, публикуемые образы, подпись, сканирование, закрепление версий, слои тестов и структура самого репозитория."}
      zh-Hans: {"titulo": "CI、发布与供应链", "descricao": "管道、发布的镜像、签名、扫描、固定版本、测试层次以及仓库自身的结构。"}
  - id: docs
    titulo: Documentação
    descricao: Como a documentação é gerada, verificada e publicada.
    i18n:
      en: {"titulo": "Documentation", "descricao": "How documentation is generated, verified and published."}
      ru: {"titulo": "Документация", "descricao": "Как документация генерируется, проверяется и публикуется."}
      zh-Hans: {"titulo": "文档", "descricao": "文档如何生成、核验和发布。"}

