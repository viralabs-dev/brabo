# A fonte ÚNICA do mapa dos 11 repos do Brabo (AT-825, ADR 0281; prova por trecho: AT-848, ADR 0285).
# Cada aresta de `depende_de` diz QUEM o repo usa, por qual CANAL (`tipo`) e onde o código prova (`prova`, arquivo + trecho literal de uma linha, na dev).
# Os READMEs recebem o bloco "Onde se encaixa" GERADO daqui por `brabo-ci:scripts/ci/mapa-dos-repos.ts`; não edite o bloco à mão.
#
# tipo:
#   codigo    o CI ou o build lê o código do outro (clone, compose, checkout)
#   imagem    usa a imagem ou o binário publicado, numa tag
#   workflow  `uses:` de workflow reutilizável ou dispatch
#   contrato  pacote do brabo-contracts ou arquivo de dados numa versão fixada
#   doc       o site agrega a `docs/` do outro
repos:
  brabo:
    papel: porta de entrada
    proposito: Porta de entrada do produto — documentação agregada, site, instalador e release.
    como_e_usado: Quem instala usa o `install.sh` e as imagens e o binário das tags de `componentes.json`; o brabo-infra o clona nas aferições cruzadas.
    depende_de:
      - { repo: brabo-api, tipo: imagem, prova: { arquivo: "componentes.json", trecho: "\"repo\": \"viralabs-dev/brabo-api\"" } }
      - { repo: brabo-engine, tipo: imagem, prova: { arquivo: "componentes.json", trecho: "\"repo\": \"viralabs-dev/brabo-engine\"" } }
      - { repo: brabo-web, tipo: imagem, prova: { arquivo: "componentes.json", trecho: "\"repo\": \"viralabs-dev/brabo-web\"" } }
      - { repo: brabo-broker, tipo: imagem, prova: { arquivo: "componentes.json", trecho: "\"repo\": \"viralabs-dev/brabo-broker\"" } }
      - { repo: brabo-runner, tipo: imagem, prova: { arquivo: "componentes.json", trecho: "\"repo\": \"viralabs-dev/brabo-runner\"" } }
      - { repo: brabo-infra, tipo: imagem, prova: { arquivo: "componentes.json", trecho: "\"backup\": { \"repo\": \"viralabs-dev/brabo-infra\"" } }
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: "componentes.json", trecho: "\"contracts\": { \"repo\": \"viralabs-dev/brabo-contracts\"" } }
      - { repo: brabo-infra, tipo: codigo, prova: { arquivo: ".github/workflows/release.yml", trecho: "repository: viralabs-dev/brabo-infra" } }
      - { repo: brabo-api, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-api " } }
      - { repo: brabo-engine, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-engine " } }
      - { repo: brabo-web, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-web " } }
      - { repo: brabo-runner, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-runner " } }
      - { repo: brabo-broker, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-broker " } }
      - { repo: brabo-contracts, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-contracts " } }
      - { repo: brabo-infra, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-infra " } }
      - { repo: brabo-ci, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-ci " } }
      - { repo: brabo-qa, tipo: doc, prova: { arquivo: "irmaos.lock", trecho: "brabo-qa " } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/ci.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@" } }

  brabo-api:
    papel: código
    proposito: API do produto (NestJS, Drizzle, PostgreSQL/pgvector) — schema, RBAC, LLM, metering e gates.
    como_e_usado: Imagem publicada por tag e consumida pelo brabo e pelo brabo-infra; o brabo-web, o brabo-engine e o brabo-qa leem o código ou o `openapi.json` dele.
    depende_de:
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: "package.json", trecho: "\"@brabo/shared\": \"npm:@viralabs-dev/brabo-shared@" } }
      - { repo: brabo-infra, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-infra" } }
      - { repo: brabo-qa, tipo: workflow, prova: { arquivo: ".github/workflows/qa-e2e.yml", trecho: "qa-e2e:" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/carimbo.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@" } }

  brabo-engine:
    papel: código
    proposito: Engine (Elixir/OTP, Phoenix, Oban) — agentes, sessões, gates e roteamento de runners.
    como_e_usado: Imagem publicada por tag, usada pelo brabo e pelo brabo-infra.
    depende_de:
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: "scripts/baixar-contratos.sh", trecho: "raw.githubusercontent.com/viralabs-dev/brabo-contracts" } }
      - { repo: brabo-api, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-api" } }
      - { repo: brabo-runner, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-runner" } }
      - { repo: brabo-qa, tipo: workflow, prova: { arquivo: ".github/workflows/qa-e2e.yml", trecho: "qa-e2e:" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/carimbo.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@" } }

  brabo-web:
    papel: código
    proposito: Interface web (React 19, Vite) — telas, i18n e design system.
    como_e_usado: Imagem publicada por tag, usada pelo brabo e pelo brabo-infra.
    depende_de:
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: "package.json", trecho: "\"@brabo/shared\": \"npm:@viralabs-dev/brabo-shared@" } }
      - { repo: brabo-api, tipo: contrato, prova: { arquivo: "fixados/ORIGEM.md", trecho: "`brabo-api:docs/reference/openapi.json`" } }
      - { repo: brabo-qa, tipo: workflow, prova: { arquivo: ".github/workflows/qa-e2e.yml", trecho: "qa-e2e:" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/carimbo.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@" } }

  brabo-runner:
    papel: código
    proposito: CLI `brabo-runner` na máquina do usuário — PTY, container local e espelho.
    como_e_usado: Binário publicado por tag, instalado pelo brabo; o brabo-engine e o brabo-qa leem o código dele nos testes.
    depende_de:
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: "package.json", trecho: "\"@brabo/docker-port\": \"npm:@viralabs-dev/brabo-docker-port@" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/ci.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@" } }

  brabo-broker:
    papel: código
    proposito: Único processo com o socket do Docker do servidor.
    como_e_usado: Imagem publicada por tag, usada pelo brabo e pelo brabo-infra.
    depende_de:
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: "package.json", trecho: "\"@brabo/docker-port\": \"npm:@viralabs-dev/brabo-docker-port@" } }
      - { repo: brabo-qa, tipo: workflow, prova: { arquivo: ".github/workflows/qa-e2e.yml", trecho: "qa-e2e:" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/carimbo.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@" } }

  brabo-contracts:
    papel: contrato
    proposito: Contratos compartilhados — os pacotes `shared` e `docker-port`, `areas.json` e `fluxo.yml`.
    como_e_usado: Consumido por TAG (pacote no GitHub Packages ou arquivo baixado por raw na mesma tag); uma tag nova pede bump em api, web, runner, broker, engine, qa e infra.
    depende_de:
      - { repo: brabo-api, tipo: contrato, prova: { arquivo: "README.md", trecho: "GERADO pelo `brabo-api`" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/ci.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@" } }

  brabo-ci:
    papel: CI
    proposito: Workflows reutilizáveis e a política de PR, escada de aprovação, promoção, tag e Dependabot.
    como_e_usado: "Cada repo chama `uses: viralabs-dev/brabo-ci/...@<sha>`, fixado por SHA."
    depende_de:
      - { repo: brabo-qa, tipo: contrato, prova: { arquivo: "scripts/ci/qa-e2e-disparar.ts", trecho: "brabo-qa/dev/funcionalidades.yml" } }
      - { repo: brabo-qa, tipo: workflow, prova: { arquivo: "scripts/ci/qa-e2e-disparar.ts", trecho: "repos/${DONO}/brabo-qa/dispatches" } }
      - { repo: brabo, tipo: contrato, prova: { arquivo: "scripts/ci/contracts-alinhado.ts", trecho: "viralabs-dev/brabo/dev/componentes.json" } }

  brabo-infra:
    papel: orquestração
    proposito: Composes, Dockerfiles de integração, `deploy/k8s`, scripts de dev, release e cadeia de suprimentos.
    como_e_usado: O brabo clona o brabo-infra no ref de `componentes.json` para subir a instalação; o brabo-api e o brabo-qa o clonam no CI.
    depende_de:
      - { repo: brabo-api, tipo: codigo, prova: { arquivo: "docker/docker-compose.prod.yml", trecho: "context: ${BRABO_IRMAOS:-../..}/brabo-api" } }
      - { repo: brabo-engine, tipo: codigo, prova: { arquivo: "docker/docker-compose.prod.yml", trecho: "context: ${BRABO_IRMAOS:-../..}/brabo-engine" } }
      - { repo: brabo-web, tipo: codigo, prova: { arquivo: "docker/docker-compose.prod.yml", trecho: "context: ${BRABO_IRMAOS:-../..}/brabo-web" } }
      - { repo: brabo-broker, tipo: codigo, prova: { arquivo: "docker/docker-compose.prod.yml", trecho: "context: ${BRABO_IRMAOS:-../..}/brabo-broker" } }
      - { repo: brabo-runner, tipo: codigo, prova: { arquivo: ".github/actions/irmaos/action.yml", trecho: "repository: viralabs-dev/brabo-runner," } }
      - { repo: brabo-contracts, tipo: codigo, prova: { arquivo: ".github/actions/irmaos/action.yml", trecho: "repository: viralabs-dev/brabo-contracts," } }
      - { repo: brabo, tipo: codigo, prova: { arquivo: ".github/actions/irmaos/action.yml", trecho: "repository: viralabs-dev/brabo," } }
      - { repo: brabo-qa, tipo: workflow, prova: { arquivo: ".github/workflows/qa-e2e.yml", trecho: "qa-e2e:" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/ci.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@" } }

  brabo-qa:
    papel: qualidade
    proposito: E2E de navegador (Playwright), golden-sets e catálogo de funcionalidades — o portão da `main`.
    como_e_usado: O brabo-ci dispara o `e2e-pr` dele e lê o `funcionalidades.yml`; api, engine, web, broker e infra o chamam como portão.
    depende_de:
      - { repo: brabo-api, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-api" } }
      - { repo: brabo-engine, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-engine" } }
      - { repo: brabo-web, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-web" } }
      - { repo: brabo-runner, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-runner" } }
      - { repo: brabo-broker, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-broker" } }
      - { repo: brabo-infra, tipo: codigo, prova: { arquivo: ".github/workflows/ci.yml", trecho: "repository: viralabs-dev/brabo-infra" } }
      - { repo: brabo-contracts, tipo: contrato, prova: { arquivo: ".github/workflows/ci.yml", trecho: "@brabo/shared vem do brabo-contracts" } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/ci.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@" } }

  brabo-workspace:
    papel: pasta-mãe
    proposito: Pasta-mãe `~/dev/brabo/` com os clones lado a lado e o `clonar-tudo.sh`.
    como_e_usado: Quem desenvolve roda `clonar-tudo.sh` uma vez; as sessões do Claude abrem nela.
    depende_de:
      - { repo: brabo, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: "REPOS=\"brabo " } }
      - { repo: brabo-api, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-api " } }
      - { repo: brabo-engine, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-engine " } }
      - { repo: brabo-web, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-web " } }
      - { repo: brabo-runner, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-runner " } }
      - { repo: brabo-broker, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-broker " } }
      - { repo: brabo-contracts, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-contracts " } }
      - { repo: brabo-ci, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-ci " } }
      - { repo: brabo-infra, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-infra " } }
      - { repo: brabo-qa, tipo: codigo, prova: { arquivo: "clonar-tudo.sh", trecho: " brabo-qa " } }
      - { repo: brabo-ci, tipo: workflow, prova: { arquivo: ".github/workflows/politica.yml", trecho: "viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@" } }
