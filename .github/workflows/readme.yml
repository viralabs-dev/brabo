name: readme

# README no esqueleto didático e mapa em dia (AT-826, AT-825), pelos reutilizáveis do brabo-ci. Informativos: não são checks obrigatórios.
# Só o README.md em pt-BR (a fonte) é conferido; as traduções seguem a mesma estrutura, mas o check não as lê.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  esqueleto:
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
    with:
      ci_ref: 22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
  mapa:
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
    with:
      ci_ref: 22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
