name: readme

# README no esqueleto didático e mapa em dia (AT-826, AT-825), pelos reutilizáveis do brabo-ci. Informativos: não são checks obrigatórios.
# Só o README.md em pt-BR (a fonte) é conferido; as traduções seguem a mesma estrutura, mas o check não as lê.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  esqueleto:
    uses: viralabs-dev/brabo-ci/.github/workflows/readme-esqueleto.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
  mapa:
    uses: viralabs-dev/brabo-ci/.github/workflows/mapa-alinhado.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
