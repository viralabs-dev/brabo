name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
    with:
      ci_ref: 22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
    with:
      ci_ref: 22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
