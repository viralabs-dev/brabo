name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
    with:
      ci_ref: 62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
    with:
      ci_ref: 62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
