name: Regenera os gerados

run-name: ${{ format('Regenera os gerados · {0}', github.event_name == 'schedule' && 'agendado' || format('manual · {0}', github.actor)) }}

# AT-726: scripts.md, índice e refs de RN dependem dos
# repositórios irmãos e ficam velhos a cada merge lá. Este workflow sobe a trava
# `irmaos.lock` (AT-780, ADR 0274), regenera por agenda e abre UMA PR fixa na
# `dev` com a trava e os gerados no MESMO commit. A PR dispensa a escada (ADR
# 0255); o merge continua sendo humano. Só ela sobe a trava.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenera-gerados
  cancel-in-progress: false

env:
  BRANCH: chore/regenera-gerados

jobs:
  regenera:
    name: Regenerar e abrir PR
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.BRABO_APP_ID }}
          private-key: ${{ secrets.BRABO_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.10.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar dependências do website
        working-directory: website
        run: pnpm install --frozen-lockfile

      # `ls-remote` de repo público, sem token. Falhou ou veio vazio: aborta, a
      # trava velha continua valendo.
      - name: Subir a trava dos irmãos
        run: |
          set -euo pipefail
          {
            sed -n '/^#/p' irmaos.lock
            # shellcheck disable=SC2013  # nomes de repo não têm espaço; a divisão por palavra é a intenção
            for r in $(awk '!/^[[:space:]]*(#|$)/ { print $1 }' irmaos.lock); do
              sha=$(git ls-remote "https://github.com/viralabs-dev/$r" refs/heads/dev | cut -f1)
              printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::$r: sem dev no remoto"; exit 1; }
              echo "$r $sha"
            done
          } > "$RUNNER_TEMP/irmaos.lock"
          mv "$RUNNER_TEMP/irmaos.lock" irmaos.lock

      # AT-796, ADR 0282: a pin de cada componente segue a última Release final (só sobe,
      # nunca desce). O `RUNNER_TAG` do install.sh anda junto. Cai na mesma PR fixa.
      - name: Subir as pins dos componentes
        id: pins
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/ci/pins-dos-componentes.ts --subir componentes.json install.sh | tee "$RUNNER_TEMP/pins.txt"
          { echo 'lista<<PINS_FIM'; grep -- ' → ' "$RUNNER_TEMP/pins.txt" || true; echo PINS_FIM; } >> "$GITHUB_OUTPUT"

      - name: Reconstruir o layout dos irmãos (trava nova)
        run: bash scripts/docs/montar-layout.sh

      # Vínculos do run (AT-773, ADR 0271): os irmãos que o layout trouxe, `repo@SHA`.
      - name: Ler os SHAs dos irmãos
        id: irmaos
        run: |
          { echo 'lista<<IRMAOS_FIM'; cat "$(git rev-parse --git-dir)/irmaos-sha.lst"; echo IRMAOS_FIM; } >> "$GITHUB_OUTPUT"
      - uses: viralabs-dev/brabo-ci/.github/actions/vinculos@53200467cadc73c5c23b90545474d4948764932f  # v1.4.0
        with:
          irmaos: ${{ steps.irmaos.outputs.lista }}

      - name: Regenerar
        run: node scripts/docs/generate.mjs

      # Só arquivos que são do brabo (estão em HEAD). O resto veio dos irmãos:
      # pendência ali precisa de PR no repo dono, então reprova nomeando-o.
      - name: Separar o que é daqui do que é dos irmãos
        id: diff
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/meus.lst"; : > "$RUNNER_TEMP/irmaos.lst"
          # o layout já pôs os irmãos no índice: o que o gerador mudou é worktree x índice
          # `--cached --diff-filter=M`: o layout deu `git add -A` e escondeu do worktree a trava que subiu
          { git diff --name-only -z | tr '\0' '\n'; git diff --cached --name-only -z --diff-filter=M | tr '\0' '\n'; git ls-files -o --exclude-standard | grep -v node_modules || true; } |
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git cat-file -e "HEAD:$f" 2>/dev/null || ! git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then echo "$f" >> "$RUNNER_TEMP/meus.lst"; else echo "$f" >> "$RUNNER_TEMP/irmaos.lst"; fi
          done
          # a trava está em HEAD, então já caiu em meus.lst quando mudou
          echo "meus=$(wc -l < "$RUNNER_TEMP/meus.lst" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Commitar e abrir, atualizar ou fechar a PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          MEUS: ${{ steps.diff.outputs.meus }}
          PINS: ${{ steps.pins.outputs.lista }}
        run: |
          set -euo pipefail
          aberta=$(gh pr list -R "$REPO" --head "$BRANCH" --base dev --state open --json number --jq '.[0].number // empty')
          if [ "$MEUS" = 0 ]; then
            if [ -n "$aberta" ]; then
              # shellcheck disable=SC2016  # as crases são texto literal da mensagem
              gh pr close "$aberta" -R "$REPO" --delete-branch --comment 'A `dev` está em dia com os gerados; nada a regenerar.'
            fi
          else
            git reset -q
            xargs -d '\n' -a "$RUNNER_TEMP/meus.lst" git add --
            git -c user.name='viralabs-dev-brabo[bot]' -c user.email='noreply@github.com' \
              commit -q -m 'docs: regenera os gerados e sobe as pins dos componentes' -m 'Gerado por regenera-gerados.yml (AT-726, AT-796).'
            # mesma árvore que a PR aberta já tem: não reempurra (re-rodaria o CI e derrubaria a aprovação)
            if git fetch -q origin "$BRANCH" 2>/dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
              echo "A PR já tem estes gerados; nada a empurrar."
            else
              git push -f origin "HEAD:refs/heads/$BRANCH"
            fi
            if [ -z "$aberta" ]; then
                # shellcheck disable=SC2016  # as crases são texto literal do corpo da PR
              gh pr create -R "$REPO" --base dev --head "$BRANCH" \
                --title 'docs: regenera os gerados e sobe as pins dos componentes' \
                --body "$(printf '%s\n\n%s\n%s' 'Aberta por `regenera-gerados.yml` (AT-726, AT-796): gerados velhos depois de mudança num irmão e/ou Release nova de componente. A PR dispensa a escada (ADR 0255, 0282); o merge é humano.' 'Pins subidas:' "${PINS:-nenhuma}")"
            fi
          fi
          if [ -s "$RUNNER_TEMP/irmaos.lst" ]; then
            # 3b: o conserto no irmão vira `git apply`, sem montar o layout na máquina
            xargs -d '\n' -a "$RUNNER_TEMP/irmaos.lst" git diff -- > "$RUNNER_TEMP/irmaos.patch" || true
            echo '::error::O gerador alterou arquivos que são de repositórios irmãos; a correção é uma PR no repo dono:'
            while read -r f; do
              case "$f" in
                apps/api/*) d=brabo-api;; apps/engine/*) d=brabo-engine;; apps/web/*) d=brabo-web;;
                apps/runner/*) d=brabo-runner;; apps/broker/*) d=brabo-broker;; packages/*) d=brabo-contracts;;
                deploy/*) d=brabo-infra;; *) d=um-irmao;;
              esac
              echo "::error file=$f::pertence a viralabs-dev/$d"
            done < "$RUNNER_TEMP/irmaos.lst"
            exit 1
          fi

      - name: Guardar o patch dos arquivos de irmãos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: irmaos-patch
          path: ${{ runner.temp }}/irmaos.patch
          if-no-files-found: ignore
