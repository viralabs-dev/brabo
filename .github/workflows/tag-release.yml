name: tag-release

run-name: ${{ format('Carimbo · {0} · {1}', github.ref_name, github.actor) }}

# Carimba a tag do estágio a cada push em dev/main (tag-release do brabo-ci, AT-704).
# A 1ª tag final na `main` sai `v1.0.0`: o ciclo inicial traz uma PR `breaking/` (MAJOR
# sobre a base 0.0.0 de `proximaVersao`, coberto em brabo-ci `version.spec.ts`).
#
# Só roda com `PRODUTO_RELEASE_LIGADA=true` (variável de repositório; o dono liga).
# O reutilizável gera o token do GitHub App (APP_ID/APP_PRIVATE_KEY) dentro do próprio job,
# então a tag dispara o `release.yml` sozinha.
on:
  push:
    branches: [dev, main]

permissions:
  contents: write
  pull-requests: write
  issues: write # o tag-release do brabo-ci declara (gate e PRs de retropropagação)

jobs:
  carimbar:
    if: vars.PRODUTO_RELEASE_LIGADA == 'true'
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
