name: Release

run-name: >-
  ${{ github.ref_type == 'tag' && format('release {0} ← tag do carimbo', github.ref_name)
    || format('release manual {0} · {1}', inputs.tag || 'ensaio', github.actor) }}

# Release do PRODUTO (AT-704): monta o `images.json` com os DIGESTS que cada repo de app
# publicou, junta o `install.sh` e os assets `brabo-install-*` e assina UM `checksums.txt`
# (cosign keyless) com a identidade DESTE workflow — a que o `install.sh` confere.
#
# Portão: `PRODUTO_RELEASE_LIGADA=true` (variável de repositório) é a única chave que
# publica. `workflow_dispatch` num ramo (sem tag) é o ENSAIO: monta, escaneia e confere
# tudo, mas NÃO assina nem publica — e roda mesmo com o portão desligado.
# Entrada: `componentes.json` (versão de cada componente) e o `imagem.json` anexado à
# Release de cada tag de app: {"imagem","tag","digest"}.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag final a publicar (vazio = ENSAIO; numa tag, o carimbo despacha sem preencher)'
        required: false
        type: string

permissions:
  contents: write # criar a GitHub Release
  id-token: write # cosign keyless: o OIDC é a identidade que assina

env:
  TRIVY_VERSION: '0.70.0'
  TRIVY_SHA256: '8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9'

jobs:
  release:
    if: vars.PRODUTO_RELEASE_LIGADA == 'true' || (github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && inputs.tag == '')
    name: Release do produto
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Quem pode republicar
        if: github.event_name == 'workflow_dispatch'
        env:
          ATOR: ${{ github.actor }}
          MODO: ${{ vars.APPROVAL_MODE || 'solo' }}
          OWNER: ${{ vars.OWNER_HANDLE }}
        run: |
          set -euo pipefail
          [ "$MODO" = 'solo' ] || exit 0
          [ -n "${OWNER:-}" ] || { echo "::error::OWNER_HANDLE não está definido."; exit 1; }
          [ "$ATOR" = "$OWNER" ] || { echo "::error::'$ATOR' não pode republicar uma release."; exit 1; }

      # A tag vem do input, ou da própria tag em que o carimbo despachou; sem nenhuma, é ENSAIO.
      - name: Qual tag publicar
        id: alvo
        env:
          ENTRADA: ${{ inputs.tag }}
          TIPO: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="$ENTRADA"
          [ -n "$tag" ] || { [ "$TIPO" = 'tag' ] && tag="${GITHUB_REF_NAME}"; } || true
          if [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "versao=0.0.0-ensaio" >> "$GITHUB_OUTPUT"
            echo "::notice::ENSAIO: monta e confere, não assina nem publica."
            exit 0
          fi
          printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::'$tag' não é tag final (vX.Y.Z)."; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "versao=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.alvo.outputs.tag || github.ref }}

      - name: A Release já existe?
        if: steps.alvo.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a Release de $TAG já existe; nota publicada é registro e não é sobrescrita."
            exit 1
          fi

      - name: Qual ref do brabo-infra
        id: infra
        run: echo "ref=$(jq -r .infra.ref componentes.json)" >> "$GITHUB_OUTPUT"

      # De lá vêm os arquivos do instalador (compose, init.sql…), o `.trivyignore.yaml` e o
      # `trivy-do-release.ts`: o `brabo` não os duplica.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-infra
          ref: ${{ steps.infra.outputs.ref }}
          path: infra

      # Vínculos (AT-773, ADR 0271): a origem sai da linha `Carimbo:` da tag e o irmão é o infra
      # por caminho. Nunca reprova o job.
      - uses: viralabs-dev/brabo-ci/.github/actions/vinculos@13f3697aaf3e4a151637755babb58422a44db303  # brabo-ci dev, merge da ci#17
        with:
          irmaos: infra

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.10.0'

      - name: Baixar o imagem.json de cada componente
        id: imagens
        env:
          GH_TOKEN: ${{ github.token }}
          ENSAIO: ${{ steps.alvo.outputs.tag == '' }}
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/imagens"
          faltam=0
          for alvo in $(jq -r '.imagens | keys[]' componentes.json); do
            repo="$(jq -r ".imagens.$alvo.repo" componentes.json)"
            tag="$(jq -r ".imagens.$alvo.tag" componentes.json)"
            if gh release download "$tag" -R "$repo" -p imagem.json -O "${RUNNER_TEMP}/imagens/${alvo}.json"; then
              echo "ok: $alvo <- $repo@$tag"
            else
              echo "::warning::$alvo: $repo@$tag não tem imagem.json"
              faltam=$((faltam + 1))
            fi
          done
          if [ "$faltam" -gt 0 ]; then
            [ "$ENSAIO" = 'true' ] || { echo "::error::$faltam componente(s) sem imagem.json — cinco de cinco ou nenhuma."; exit 1; }
            echo "::notice::ENSAIO: imagens não montadas ($faltam sem Release); Trivy e verificação de imagem ficam para a 1ª tag."
          fi
          echo "completo=$([ "$faltam" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Montar o images.json do produto
        if: steps.imagens.outputs.completo == 'true'
        env:
          VERSAO: ${{ steps.alvo.outputs.versao }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node scripts/ci/montar-images.ts componentes.json "${RUNNER_TEMP}/imagens" "$VERSAO" "${GITHUB_SHA::12}" > dist/images.json
          cat dist/images.json

      # Trivy por digest ANTES de assinar, com as flags do monorepo e o MESMO
      # `.trivyignore.yaml` (sem allowlist nova).
      - name: Instalar o binário do trivy
        if: steps.imagens.outputs.completo == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy image --cache-dir /tmp/trivy-cache --no-progress --download-db-only

      - name: Trivy — relatório do que não tem correção
        if: steps.imagens.outputs.completo == 'true'
        env:
          VERSAO: ${{ steps.alvo.outputs.versao }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy"
          node infra/scripts/ci/trivy-do-release.ts referencias dist/images.json \
            | while read -r alvo referencia; do
                trivy image --cache-dir /tmp/trivy-cache --image-src remote --no-progress \
                  --format json --output "${RUNNER_TEMP}/trivy/${alvo}.json" --scanners vuln \
                  --severity HIGH,CRITICAL --ignorefile infra/.trivyignore.yaml \
                  --skip-db-update --exit-code 0 "${referencia}"
              done
          node infra/scripts/ci/trivy-do-release.ts resumo dist/images.json \
            "${RUNNER_TEMP}/trivy" "${VERSAO}" > dist/trivy-sem-correcao.md
          cat dist/trivy-sem-correcao.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy — HIGH/CRITICAL com correção reprova, antes de assinar
        if: steps.imagens.outputs.completo == 'true'
        run: |
          set -uo pipefail
          reprovadas=()
          while read -r alvo referencia; do
            if ! trivy image --cache-dir /tmp/trivy-cache --image-src remote --no-progress \
                --format table --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --ignorefile infra/.trivyignore.yaml --skip-db-update --exit-code 1 "${referencia}"; then
              echo "::error::Trivy reprovou ${alvo} (${referencia})."
              reprovadas+=("${alvo}")
            fi
          done < <(node infra/scripts/ci/trivy-do-release.ts referencias dist/images.json)
          [ "${#reprovadas[@]}" -eq 0 ] || { echo "Reprovado: ${reprovadas[*]} — nada assinado."; exit 1; }

      # `install.sh`, a oferta de fonte e os assets `brabo-install-*` entram no MESMO
      # `checksums.txt` — o que o instalador confere antes de gravar.
      - name: Reunir os arquivos e gerar o checksums.txt
        run: |
          set -euo pipefail
          mkdir -p dist
          assets="$(node scripts/ci/assets-do-instalador.ts preparar infra dist)"
          [ -n "$assets" ] || { echo "::error::nenhum asset do instalador"; exit 1; }
          cp install.sh dist/
          [ ! -f THIRD_PARTY_NOTICES.md ] || cp THIRD_PARTY_NOTICES.md dist/
          cd dist
          arquivos="install.sh $assets"
          [ ! -f THIRD_PARTY_NOTICES.md ] || arquivos="$arquivos THIRD_PARTY_NOTICES.md"
          [ ! -f images.json ] || arquivos="$arquivos images.json"
          # shellcheck disable=SC2086
          sha256sum $arquivos > checksums.txt
          sha256sum -c --strict checksums.txt
          cat checksums.txt

      - name: Instalar o cosign
        if: steps.alvo.outputs.tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # As imagens já foram assinadas pelos repos de app (identidade deles): aqui só se
      # confere, por digest, que a assinatura existe e é de um workflow da org.
      - name: Verificar a assinatura das imagens
        if: steps.alvo.outputs.tag != ''
        run: |
          set -euo pipefail
          jq -r '.imagens[] | "\(.repositorio)@\(.digest)"' dist/images.json | while read -r ref; do
            cosign verify \
              --certificate-identity-regexp '^https://github.com/viralabs-dev/brabo-[a-z-]+/\.github/workflows/[^/]+@' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$ref" > /dev/null
            echo "verificado: $ref"
          done

      - name: Assinar e verificar o checksums.txt
        if: steps.alvo.outputs.tag != ''
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle checksums.txt.bundle checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            checksums.txt

      - name: Publicar a GitHub Release
        if: steps.alvo.outputs.tag != ''
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag ./*

      - name: Resumo do ensaio
        if: steps.alvo.outputs.tag == ''
        run: |
          {
            echo "### Ensaio da release do produto"
            echo "Nada foi assinado nem publicado. checksums.txt montado e conferido:"
            echo '```'; cat dist/checksums.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
