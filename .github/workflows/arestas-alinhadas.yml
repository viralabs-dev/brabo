name: arestas-alinhadas

# AT-848, ADR 0285: roda toda segunda-feira a prova de que cada aresta do `repos.yml` existe no código
# (arquivo + trecho literal) e de que REPOS, irmaos.lock e componentes.json batem com o mapa. Informativo: não é check obrigatório.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arestas:
    uses: viralabs-dev/brabo-ci/.github/workflows/arestas-alinhadas.yml@22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
    with:
      ci_ref: 22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
