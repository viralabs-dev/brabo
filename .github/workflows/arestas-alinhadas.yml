name: arestas-alinhadas

# AT-848, ADR 0285: roda toda segunda-feira a prova de que cada aresta do `repos.yml` existe no código
# (arquivo + trecho literal) e de que REPOS, irmaos.lock e componentes.json batem com o mapa. Informativo: não é check obrigatório.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arestas:
    uses: viralabs-dev/brabo-ci/.github/workflows/arestas-alinhadas.yml@62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
    with:
      ci_ref: 62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
