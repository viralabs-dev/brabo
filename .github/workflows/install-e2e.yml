name: E2E do instalador

# DORMENTE ATÉ A AT-704 (Rodada 180, AT-702): o workflow veio do monorepo com os
# gatilhos originais (o `docs:check` do runbook confere `push: tags` no `on:`), mas
# CADA job só roda com a variável de repositório `PRODUTO_RELEASE_LIGADA=true`.
# Sem ela, nenhum push cria tag nem publica nada. A release do PRODUTO (1.0.0)
# nasce aqui e depende dos `scripts/ci/*` de release do `brabo-infra`.


# PROVA o `install.sh` numa máquina limpa — e o runner efêmero do Actions é
# exatamente isso: um host recém-criado, sem Brabo, sem `.env`, sem marcador.
#
# POR QUE NÃO RODA EM `pull_request`, que seria o óbvio: o instalador verifica a
# própria origem contra o `checksums.txt` ASSINADO de uma Release (RN-526), e
# esse manifesto só existe depois de uma tag final. Em PR não há o que
# verificar, e a única forma de fazer o script rodar ali seria dar-lhe uma porta
# para PULAR a verificação — precisamente a porta que o ADR 0150 recusa, e que
# uma vez aberta valeria para qualquer um, não só para o CI.
#
# Mesma decisão, pelo mesmo motivo, do golden-set do RAG
# (`golden-set-rag.yml`, ADR 0138): o que não é exercitável em PR roda em
# cadência própria, e o workflow diz por quê em vez de fingir cobertura.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag final a exercitar (ex.: v1.2.0)'
        required: true
        type: string

permissions:
  contents: read # só baixa a Release; não publica nada

concurrency:
  group: install-e2e-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  instalar:
    if: vars.PRODUTO_RELEASE_LIGADA == 'true'
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-14]
    runs-on: ${{ matrix.os }}
    # 25 bastavam enquanto o job parava no `.env`. Com o fechamento inteiro
    # (RN-547) ele ainda espera o agente entrar na espera e, depois do projeto
    # nascer, a cadência de 15s/30s/60s da RN-550 — os dois com teto próprio,
    # somando até 7min no pior caso.
    timeout-minutes: 60 # +20min da migração (AT-738): backup, prova, apagar, recriar e restaurar
    steps:
      - name: Qual tag
        id: alvo
        env:
          ENTRADA: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            tag="$ENTRADA"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A Release nasce alguns minutos depois da tag, e este workflow dispara
      # junto com `release.yml`. Mesma corrida que `build-runner-binaries.yml`
      # documenta e resolve do mesmo jeito: espera LIMITADA, e ausência que
      # PERSISTE pelo teto é erro explícito.
      - name: Esperar a Release e os assets do instalador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          # A Release fica VISÍVEL antes de os assets subirem: na v7.0.0 ela
          # apareceu às 20:06:11 e o install.sh só às 20:06:37, e o download
          # das 20:06:23 deu 404. Espera-se pelos TRÊS assets que o primeiro
          # passo e a autoverificação do instalador leem, não pela Release.
          limite=$(( SECONDS + 900 ))
          faltam() {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name] as $a | ["install.sh","checksums.txt","checksums.txt.bundle"] - $a | length' \
              2>/dev/null || echo 3
          }
          until [ "$(faltam)" = "0" ]; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::a Release de $TAG não tem install.sh, checksums.txt e checksums.txt.bundle depois de 900s — este workflow só EXERCITA uma Release existente."
              exit 1
            fi
            sleep 20
          done

      # O `install.sh` vem da RELEASE, não do checkout — é o arquivo que uma
      # pessoa de verdade baixa, e é ele que precisa provar que funciona. Baixar
      # do checkout testaria um arquivo que ninguém executa.
      #
      # E vem pela MESMA forma que o runbook manda (AT-083): `curl -fsSLO` para
      # um arquivo, e depois `bash install.sh` em todo passo — nunca
      # `./install.sh`, que dependeria de um `chmod +x` que quem instala não faz.
      # A única diferença é a URL, por tag e não `latest`, porque este job
      # exercita a tag que o disparou.
      - name: Baixar o instalador publicado
        env:
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh"
          test -f install.sh || { echo "::error::o curl -fsSLO não deixou um install.sh na pasta"; exit 1; }

      # Não há mais passo que traga arquivos à mão, e a AUSÊNCIA é a asserção.
      #
      # Até o ADR 0160 existia aqui um passo "achado declarado" que baixava
      # `docker/docker-compose.install.yml`, `docker/postgres/init.sql` e
      # `docker/ollama/pull-models.sh` da tag por `raw.githubusercontent.com`,
      # porque o instalador PUBLICADO não os trazia e morria depois de gravar o
      # `.env` (RN-549). Desde a RN-570 eles são assets da Release, entram no
      # `checksums.txt` assinado, e o `install.sh` os baixa e confere antes de
      # perguntar qualquer coisa. Este job não tem checkout: a pasta de trabalho
      # só tem o `install.sh` baixado, e é por isso que este passo pode afirmar
      # que não há `docker/` nenhum — tudo o que aparecer ali depois veio do
      # instalador. `scripts/dev/install-e2e.spec.ts` reprova quem repuser o
      # contorno.
      - name: Nenhum arquivo da instalação trazido à mão
        run: |
          set -euo pipefail
          test ! -e docker \
            || { echo "::error::há um docker/ na pasta antes do instalador rodar — o E2E deixaria de provar que ele os baixa"; ls -laR docker; exit 1; }

      # PRIMEIRO os modos que não tocam nada. Se o plano já mentir, o resto do
      # job é ruído.
      - name: O plano e o estado, numa máquina limpa
        run: |
          set -euo pipefail
          NO_COLOR=1 bash install.sh --print-state | tee estado.txt
          grep -q 'marcador-existe	nao' estado.txt \
            || { echo "::error::máquina limpa e o instalador diz que há marcador"; exit 1; }
          grep -qE '^sinal' estado.txt \
            && { echo "::error::máquina limpa e o instalador achou sinais de instalação"; exit 1; }

          NO_COLOR=1 bash install.sh --print-plan | tee plano.txt
          grep -q 'apagar-base-de-projetos	nunca' plano.txt || { echo "::error::o plano deixou de prometer que nunca apaga a base"; exit 1; }
          grep -q 'apagar-pasta-de-espelho	nunca' plano.txt || { echo "::error::o plano deixou de prometer que nunca apaga o espelho"; exit 1; }
          grep -q 'apagar-sem-backup-provado	nunca' plano.txt || { echo "::error::o plano deixou de prometer que não apaga sem backup provado"; exit 1; }

      # Sem TTY o instalador RELATA e sai 0 — e isto é o que prova que ele não
      # decide sozinho quando não pode perguntar. É também o único caminho do
      # fluxo real que se exercita sem simular um terminal.
      - name: Sem TTY, relata e sai bem
        run: |
          set -euo pipefail
          NO_COLOR=1 bash install.sh < /dev/null > saida.txt 2>&1 || {
            echo "::error::sem TTY o instalador deveria sair 0"
            cat saida.txt
            exit 1
          }
          grep -q 'Sem terminal interativo' saida.txt \
            || { echo "::error::sem TTY, o instalador não disse que não decidiu nada"; cat saida.txt; exit 1; }
          # E ensina a forma que FUNCIONA (AT-083: ensinava o `sh -c "$(curl …)"`,
          # que nunca rodou).
          grep -qF 'curl -fsSLO' saida.txt \
            || { echo "::error::sem TTY, o instalador não ensinou baixar e rodar com bash"; cat saida.txt; exit 1; }
          test ! -f "${XDG_STATE_HOME:-$HOME/.local/state}/brabo/install-state.json" \
            || { echo "::error::sem TTY o instalador GRAVOU o marcador"; exit 1; }

          # A metade da RN-570 que este passo alcança, e nas DUAS plataformas:
          # os arquivos da instalação são baixados e conferidos contra o
          # manifesto assinado ANTES de o script saber que não pode perguntar —
          # e, sem TTY, nada é gravado na pasta.
          grep -q 'arquivos da instalação verificados contra o manifesto assinado' saida.txt \
            || { echo "::error::o instalador não verificou os arquivos da instalação contra o manifesto"; cat saida.txt; exit 1; }
          test ! -e docker \
            || { echo "::error::sem TTY o instalador GRAVOU arquivos da instalação na pasta"; exit 1; }

      # A ÚNICA divergência declarada entre este runner e a máquina limpa de uma
      # pessoa, e ela é do AMBIENTE, nunca do instalador. Numa máquina de
      # verdade quem instala tem SESSÃO de login e o `systemd --user` já está de
      # pé; o job do Actions roda não-interativo, sem sessão, e sem ela
      # `systemctl --user` não tem barramento a que falar. Sem este passo o
      # `service install --machine` viraria pendência por um motivo que não é do
      # produto, e o E2E "provaria" uma falha de laboratório.
      #
      # `enable-linger` não toca em nada do instalador: ele não é flag do
      # script, não pula verificação nenhuma e não muda o que a unit faz.
      - name: Sessão de usuário para o systemd (divergência declarada)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/${uid}"
          export XDG_RUNTIME_DIR
          limite=$(( SECONDS + 90 ))
          until systemctl --user show-environment >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::o systemd de usuário não subiu em 90s — o resto do job não teria o que medir"
              exit 1
            fi
            sleep 2
          done
          echo "systemd de usuário de pé em ${XDG_RUNTIME_DIR}"

      # O fluxo completo exige um terminal, e o que dá um é um PTY de verdade —
      # não um pipe, que é justamente o que mataria o consentimento.
      #
      # Até a AT-083 este passo rodava `script -qec "… ./install.sh … < respostas"`,
      # e o `<` ficava DENTRO do comando do `script`: o stdin do INSTALADOR era o
      # arquivo de respostas, `[ -t 0 ]` era sempre falso, e o fluxo interativo
      # nunca foi exercitado — o instalador relatava "Sem terminal interativo" e
      # saía 0, enquanto este comentário afirmava o contrário. Agora quem roda o
      # instalador é um driver de PTY em Python (o `python3` do runner, sem
      # dependência nova): o instalador nasce com o lado ESCRAVO do pty como
      # stdin/stdout/stderr, e o driver ESPERA cada pergunta aparecer antes de
      # escrever a resposta no lado MESTRE — como uma pessoa no teclado.
      #
      # Esperar a pergunta, e não despejar tudo de uma vez, não é capricho: o pty
      # ECOA o que recebe enquanto o eco está ligado, e a senha despejada antes de
      # o `stty -echo` do instalador rodar apareceria na saída (e reprovaria a
      # asserção de vazamento logo abaixo). Para as respostas marcadas como
      # SEGREDO o driver vai além: só escreve depois de ler, no próprio pty, que o
      # eco foi DESLIGADO — o que prova, de passagem, o "lida sem eco" da RN-547.
      #
      # A ORDEM é a dos `read` do script NUMA MÁQUINA LIMPA, e ela NÃO tem a
      # pergunta de migração: o bloco que a faz está sob
      # `if [ -n "$marcador" ] || [ -n "$sinais" ]`, e numa máquina limpa os dois
      # são vazios. São OITO — marcador, base, o broker de container,
      # consentimento da conta, e-mail, senha, senha de novo, e nome (vazio, que
      # é "pular"). O broker responde SIM (ADR 0162): o runner Linux tem Docker
      # e o socket em `/var/run/docker.sock`, e só respondendo sim o E2E prova
      # o que a pergunta nova promete — a imagem publicada puxada por digest, o
      # gid medido de dentro de um container, o serviço healthy e a api o
      # alcançando pela rede interna. Responder não provaria só que uma linha
      # de texto foi impressa. Cada uma espera um
      # TRECHO da pergunta, e `scripts/dev/install-e2e.spec.ts` confere que cada
      # trecho existe no `install.sh` e roda este mesmo driver contra um
      # instalador de mentira — este workflow NÃO roda em PR, e aquele spec roda.
      - name: Instalação completa, com TTY de verdade — e o fechamento inteiro
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          # Gerada AQUI e nunca fixa: segredo em fixture é segredo no
          # repositório. `openssl rand -base64 18` dá 24 caracteres, acima do
          # mínimo de 12 da política do domínio, e o alfabeto base64 não tem
          # `"` nem `\` (o que o `escapar_json` do instalador teria de escapar)
          # nem tabulação, que ele RECUSA em vez de remover.
          email='e2e-da-instalacao@example.com'
          senha="$(openssl rand -base64 18)"
          echo "::add-mask::${senha}"
          ( umask 077; printf '%s\n%s\n' "$email" "$senha" > "${RUNNER_TEMP}/credencial" )

          # A senha entra no JSON pelo AMBIENTE (`env.E2E_SENHA`), nunca por
          # `--arg`, que é argv — a mesma régua do passo que faz login.
          respostas="${RUNNER_TEMP}/respostas.json"
          E2E_SENHA="$senha" E2E_EMAIL="$email" E2E_BASE="${HOME}/projetos-brabo" \
            jq -n '[
              {espera: "Gravar o marcador de instalação", resposta: "s"},
              {espera: "Base [", resposta: env.E2E_BASE},
              {espera: "Ligar o broker de container? [s/N] ", resposta: "s"},
              {espera: "Ligar os modelos locais? [s/N] ", resposta: "n"},
              {espera: "Criar a primeira conta agora?", resposta: "s"},
              {espera: "E-mail: ", resposta: env.E2E_EMAIL},
              {espera: "Senha (não aparece na tela): ", resposta: env.E2E_SENHA, segredo: true},
              {espera: "Repita a senha: ", resposta: env.E2E_SENHA, segredo: true},
              {espera: "Nome (opcional, Enter para pular): ", resposta: ""}
            ]' > "$respostas"
          chmod 600 "$respostas"

          cat > "${RUNNER_TEMP}/terminal-do-e2e.py" <<'PY'
          import json, os, pty, select, sys, termios, time

          # Uso: terminal-do-e2e.py <respostas.json> <comando...>
          # Sai com o código do instalador; 3 quando uma pergunta não chegou, 4
          # quando uma resposta SECRETA teria sido escrita com o eco ligado.
          respostas = json.load(open(sys.argv[1], encoding="utf-8"))
          comando = sys.argv[2:]
          TETO = float(os.environ.get("TETO_POR_PERGUNTA", "1800"))
          TETO_DO_ECO = float(os.environ.get("TETO_DO_ECO", "10"))

          pid, mestre = pty.fork()
          if pid == 0:
              os.execvp(comando[0], comando)

          lido = bytearray()
          terminou = False
          saida_do_filho = None

          # Fim de conversa é o FILHO sair, e não só o EOF do pty: um neto que
          # herdasse o terminal o manteria aberto, e o driver esperaria o teto.
          def filho_saiu():
              global saida_do_filho
              if saida_do_filho is None:
                  fim, status = os.waitpid(pid, os.WNOHANG)
                  if fim:
                      saida_do_filho = os.waitstatus_to_exitcode(status)
              return saida_do_filho is not None

          def ler(espera):
              global terminou
              pronto, _, _ = select.select([mestre], [], [], espera)
              if not pronto:
                  if filho_saiu():
                      terminou = True
                  return
              try:
                  pedaco = os.read(mestre, 65536)
              except OSError:
                  pedaco = b""
              if not pedaco:
                  terminou = True
                  return
              lido.extend(pedaco)
              sys.stdout.buffer.write(pedaco)
              sys.stdout.buffer.flush()

          def eco_ligado():
              return bool(termios.tcgetattr(mestre)[3] & termios.ECHO)

          def morrer(codigo, motivo):
              sys.stdout.buffer.write(("\n[terminal-do-e2e] " + motivo + "\n").encode())
              sys.stdout.buffer.flush()
              try:
                  os.kill(pid, 15)
              except OSError:
                  pass
              sys.exit(codigo)

          inicio = 0
          for item in respostas:
              alvo = item["espera"].encode("utf-8")
              limite = time.monotonic() + TETO
              while True:
                  achou = lido.find(alvo, inicio)
                  if achou >= 0:
                      inicio = achou + len(alvo)
                      break
                  if terminou:
                      morrer(3, "o instalador terminou sem perguntar: " + item["espera"])
                  if time.monotonic() > limite:
                      morrer(3, "a pergunta não chegou em %ds: %s" % (TETO, item["espera"]))
                  ler(1.0)
              if item.get("segredo"):
                  limite = time.monotonic() + TETO_DO_ECO
                  while eco_ligado():
                      if time.monotonic() > limite:
                          morrer(4, "o eco seguia LIGADO ao pedir: " + item["espera"])
                      ler(0.05)
              os.write(mestre, (item["resposta"] + "\n").encode("utf-8"))

          while not terminou:
              ler(1.0)
          if saida_do_filho is None:
              _, status = os.waitpid(pid, 0)
              saida_do_filho = os.waitstatus_to_exitcode(status)
          sys.exit(saida_do_filho)
          PY

          # `-I` tira a pasta do script do `sys.path`: um `tty.py` ao lado dele
          # (foi o primeiro nome deste driver) sombreia o `tty` da biblioteca
          # padrão que o `pty` importa, e o driver morre antes de começar.
          codigo=0
          NO_COLOR=1 python3 -I "${RUNNER_TEMP}/terminal-do-e2e.py" "$respostas" bash install.sh --source=ghcr \
            > completa.txt || codigo=$?
          rm -f "$respostas"
          cat completa.txt
          case "$codigo" in
            3|4) echo "::error::o driver do TTY parou (código ${codigo}) — ver a última linha acima"; exit 1 ;;
          esac

          # A prova de que o TTY chegou ao instalador, e a que faltou por meses:
          # sem ela, o resto deste passo reprovaria por motivos que nada dizem.
          if grep -qF 'Sem terminal interativo' completa.txt; then
            echo '::error::o instalador não viu um terminal — o stdin dele não é o pty'
            exit 1
          fi

          exigir() {
            grep -qF -- "$2" completa.txt \
              || { echo "::error::$1 (não achei na saída: $2)"; exit 1; }
          }

          # O que a FASE 29 já provava.
          exigir 'a verificação de assinatura não passou' 'assinatura do manifesto confere'
          exigir 'o instalador não conferiu o próprio hash' 'este arquivo é o que a Release publicou'

          # RN-570: os arquivos que sobem a instalação vieram da Release,
          # conferidos no manifesto, e foram gravados pelo PRÓPRIO instalador
          # numa pasta que não tinha `docker/` nenhum.
          exigir 'os arquivos da instalação não foram verificados' 'arquivos da instalação verificados contra o manifesto assinado'
          exigir 'os arquivos da instalação não foram gravados' 'arquivos da instalação gravados em '

          # ADR 0162: o broker foi ligado com consentimento, o gid saiu de uma
          # medição (não do default 999), e a api o alcança pela rede interna.
          # A raiz da pasta gerenciada conferida com o volume vem na prova
          # negativa abaixo: divergir vira pendência, e pendência reprova.
          exigir 'o gid do socket não foi medido' 'grupo do socket, visto de dentro de um container: '
          exigir 'o broker não foi ligado' 'broker de container: ligado'
          exigir 'a api não alcançou o broker' 'a api alcança o broker pela rede interna'
          exigir 'a raiz da pasta gerenciada não conferiu' 'a raiz da pasta gerenciada confere com o volume'
          grep -qx 'COMPOSE_PROFILES=container-broker' .env \
            || { echo "::error::o .env não liga o profile do broker"; exit 1; }
          grep -qx 'BROKER_URL=http://broker:8090' .env \
            || { echo "::error::o .env não aponta a api para o broker"; exit 1; }

          # Os CINCO elos da RN-547, um a um, contra api e binário de verdade.
          # Nos testes da sessão 6 o `brabo-runner` é dublê de shell e a api é
          # um `node:http`: o que se provava lá é o ENCADEAMENTO, e é só aqui
          # que existe integração para provar.
          exigir 'elo 1 (RN-546): a primeira conta não foi criada' 'conta criada e já verificada'
          exigir 'elo 2 (RN-551): o par não foi gerado na máquina' 'par Ed25519 gerado nesta máquina'
          exigir 'elo 3 (RN-552): a pública não foi registrada' 'chave registrada na api (id '
          exigir 'elo 4 (RN-551): o `kid` não foi carimbado' 'chave completa em '
          exigir 'elo 5 (RN-545): a unit de máquina não foi instalada' 'agente local instalado como serviço desta máquina'

          # A prova NEGATIVA, e é a que mais vale: a RN-547 manda RELATAR cada
          # elo que falha num bloco final nomeado, e sair 0 do mesmo jeito. Um
          # E2E que só olhasse o código de saída daria verde com quatro dos
          # cinco elos quebrados. "Nenhuma pendência" é a única forma de
          # afirmar que os cinco fecharam, inclusive os que este passo não sabe
          # nomear.
          if grep -qF 'O que ficou pendente' completa.txt; then
            echo '::error::a instalação terminou com pendências — algum elo do fechamento não fechou'
            sed -n '/O que ficou pendente/,$p' completa.txt
            exit 1
          fi

          test -f "${XDG_STATE_HOME:-$HOME/.local/state}/brabo/install-state.json" \
            || { echo "::error::a instalação terminou sem marcador"; exit 1; }
          test "$(stat -c '%a' .env)" = '600' \
            || { echo "::error::o .env não está com modo 600"; exit 1; }

          # O arquivo que o runner LÊ nunca existe sem `kid` (RN-475/RN-551), e
          # o `.parcial` do `create` some quando o `finish` fecha. Medido no
          # disco, não na saída: é o invariante que custou uma caçada.
          chave="${XDG_CONFIG_HOME:-$HOME/.config}/brabo/brabo-runner-device-key.jwk.json"
          test -f "$chave" || { echo "::error::a chave desta máquina não ficou no disco"; exit 1; }
          jq -e 'has("kid") and (.kid | length > 0)' "$chave" >/dev/null \
            || { echo "::error::a chave que o runner lê ficou SEM kid"; exit 1; }
          jq -e 'has("d")' "$chave" >/dev/null \
            || { echo "::error::a privada não é privada — sem `d` o runner não assina nada"; exit 1; }
          test ! -f "${chave}.parcial" \
            || { echo "::error::o .parcial sobrou depois de o finish fechar"; exit 1; }

          # A senha foi lida, usada e descartada (RN-547). Se ela aparecer em
          # qualquer um destes, o instalador a gravou.
          for arquivo in .env "${XDG_STATE_HOME:-$HOME/.local/state}/brabo/install-state.json" completa.txt; do
            if grep -qF -- "$senha" "$arquivo" 2>/dev/null; then
              echo "::error::a senha vazou para ${arquivo}"
              exit 1
            fi
          done
          grep -qF -- "$email" "${XDG_STATE_HOME:-$HOME/.local/state}/brabo/install-state.json" \
            || { echo "::error::o marcador não guardou o ownerEmail"; exit 1; }

      # RN-570, medida no DISCO e contra o manifesto da Release — não contra a
      # frase: os arquivos que subiram a pilha são byte a byte os assets que a
      # esteira assinou. Passo PRÓPRIO, depois da instalação, para que o token
      # que baixa o manifesto nunca esteja no ambiente do instalador.
      - name: Os arquivos que subiram a pilha são os que a Release assinou
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          # `sha256sum -c` lê as linhas pelos NOMES de asset; os arquivos que o
          # instalador gravou são ligados sob esses nomes numa pasta à parte.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "${RUNNER_TEMP}/manifesto"
          conferir="${RUNNER_TEMP}/conferir"
          mkdir -p "$conferir"
          ln -s "$PWD/docker/docker-compose.install.yml" "$conferir/brabo-install-compose.yml"
          ln -s "$PWD/docker/postgres/init.sql" "$conferir/brabo-install-postgres-init.sql"
          ln -s "$PWD/docker/ollama/pull-models.sh" "$conferir/brabo-install-ollama-pull-models.sh"
          ln -s "$PWD/docker/backup/test-restore-compose.sh" "$conferir/brabo-install-backup-test-restore.sh"
          grep ' brabo-install-' "${RUNNER_TEMP}/manifesto/checksums.txt" > "$conferir/esperado.txt" || true
          test "$(wc -l < "$conferir/esperado.txt")" -eq 4 \
            || { echo "::error::o manifesto da Release não cobre os quatro arquivos da instalação"; cat "$conferir/esperado.txt"; exit 1; }
          ( cd "$conferir" && sha256sum -c --strict esperado.txt ) \
            || { echo "::error::os arquivos que o instalador gravou não são os que a Release assinou"; exit 1; }

      # A asserção que prova a promessa da fase, e o SINAL é a decisão deste
      # passo.
      #
      # NÃO é `systemctl is-active` nem `service status --machine` sozinhos:
      # `perguntarEstado` mapeia `activating` para `rodando` — com razão, porque
      # "subindo" não é "parado" —, então os dois respondem "de pé" para um
      # processo que vai morrer dois segundos depois. É exatamente a corrida que
      # um `sleep` fixo esconde, e medir o artefato errado aqui é o jeito mais
      # fácil de este E2E dar verde sem provar nada.
      #
      # O sinal é a LINHA que o processo escreve ao ENTRAR na espera (RN-550,
      # `apps/runner/src/index.ts`): ela só existe depois de o agente ter lido a
      # chave de máquina do disco, tirado ticket, falado com a api de VERDADE e
      # recebido de volta uma lista VAZIA. Ela prova pareamento e espera de uma
      # vez. E não é amostragem de estado — é um fato já gravado no journal, que
      # não se desfaz —, então esperar por ELA com teto não é corrida: ou ela
      # aparece, ou o teto estoura e o passo reprova mostrando o journal.
      #
      # `service status --machine` entra DEPOIS, e só como confirmação de que os
      # quatro códigos respondem o que a tela do operador vai ver.
      - name: O agente está DE PÉ, esperando o primeiro projeto
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          unidade='brabo-runner.service'

          test -f "${HOME}/.config/systemd/user/${unidade}" \
            || { echo "::error::a unit de MÁQUINA não foi escrita"; exit 1; }
          # O nome sem sufixo é o que distingue as duas espécies (RN-545), e uma
          # unit por PROJETO aqui significaria que o instalador pareou com um
          # projeto — exatamente o que ele diz que não faz.
          if compgen -G "${HOME}/.config/systemd/user/brabo-runner-*.service" >/dev/null; then
            echo '::error::apareceu unit por PROJETO numa instalação que não tem projeto nenhum'
            exit 1
          fi

          # O journal é LIDO INTEIRO antes do `grep` (AT-242), nunca por pipe: o
          # `journalctl` escreve em pedaços (medido: 13 escritas para 300
          # linhas), o `grep -q` sai na linha que casa e, sob `pipefail`, o
          # EPIPE do resto faria a linha que JÁ está lá contar como ausente. O
          # `journalctl` que falha segue sendo "ainda não", até o teto.
          ja_disse() {
            local journal
            journal="$(journalctl --user -u "$1" --no-pager 2>/dev/null)" || return 1
            grep -qF "$2" <<<"$journal"
          }
          limite=$(( SECONDS + 180 ))
          until ja_disse "$unidade" 'FICA DE PÉ'; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo '::error::o agente nunca disse que está esperando projeto — ele não subiu, ou não chegou a falar com a api'
              systemctl --user status "$unidade" --no-pager --full || true
              journalctl --user -u "$unidade" --no-pager || true
              exit 1
            fi
            sleep 3
          done
          echo 'o agente entrou na espera — leu a chave, tirou ticket e recebeu lista vazia da api'

          codigo=0
          "${HOME}/.local/bin/brabo-runner" service status --machine || codigo=$?
          [ "$codigo" -eq 0 ] \
            || { echo "::error::service status --machine devolveu ${codigo}; 0 (rodando) é o esperado"; exit 1; }

      # O DESFECHO que a fase inteira persegue: a pessoa cria o primeiro projeto
      # em modo Runner e o agente o pega, sem ninguém voltar ao terminal.
      #
      # Pela API e não pelo NAVEGADOR, e a escolha é deliberada. O sujeito da
      # afirmação é o AGENTE, não a página: o que ele observa é
      # `GET /runner/projects`, um fato da api. Um navegador criaria o projeto
      # pela MESMA rota com uma camada a mais que pode falhar por motivos que
      # nada têm a ver com a promessa — e não tornaria a asserção mais forte,
      # porque ela continua sendo a linha do journal do agente. A camada de
      # navegador já existe (`e2e/`, ADR 0120), responde outra pergunta (três
      # origens, cookie httpOnly, CSRF), tem lockfile próprio e assume o compose
      # de produção de pé: arrastá-la para cá faria o E2E do instalador depender
      # de um segundo harness instalado numa máquina que deveria estar limpa.
      # Provar o wizard é trabalho da suíte do web, e ele já é coberto lá.
      - name: O primeiro projeto em modo Runner, e o agente o pega
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          api='http://localhost:3000'
          E2E_EMAIL="$(sed -n 1p "${RUNNER_TEMP}/credencial")"
          E2E_SENHA="$(sed -n 2p "${RUNNER_TEMP}/credencial")"
          export E2E_EMAIL E2E_SENHA
          echo "::add-mask::${E2E_SENHA}"

          # A senha vai pelo STDIN do curl, nunca por `argv`, pelo mesmo motivo
          # que o instalador tem (`/proc/<pid>/cmdline`) — e o `jq -n` a lê do
          # AMBIENTE, nunca de `--arg`, que também é argv.
          token="$(jq -n '{email: env.E2E_EMAIL, senha: env.E2E_SENHA}' \
            | curl -fsS -X POST "${api}/auth/login" \
                -H 'Content-Type: application/json' --data-binary @- \
            | jq -r '.accessToken')"
          [ -n "$token" ] && [ "$token" != 'null' ] \
            || { echo '::error::a conta criada pelo instalador não fez login — ela nasceu verificada?'; exit 1; }
          echo "::add-mask::${token}"
          echo 'a conta nascida no terminal atravessa o login, sem link de verificação nenhum'

          # O workspace PESSOAL que a RN-546 cria na mesma transação. Sem ele o
          # "Novo projeto" não teria onde criar, e é por isso que ele entrou.
          ws="$(curl -fsS "${api}/workspaces" -H "Authorization: Bearer ${token}" | jq -r '.[0].workspace.id')"
          [ -n "$ws" ] && [ "$ws" != 'null' ] \
            || { echo '::error::a conta nasceu sem workspace pessoal'; exit 1; }

          jq -n --arg caminho "${HOME}/projetos-brabo/e2e-da-instalacao" \
            '{name: "E2E da instalacao", slug: "e2e-da-instalacao",
              executionMode: "runner", workspacePath: $caminho}' \
            | curl -fsS -X POST "${api}/workspaces/${ws}/projects" \
                -H "Authorization: Bearer ${token}" \
                -H 'Content-Type: application/json' --data-binary @- > projeto.json
          jq -e '.executionMode == "runner"' projeto.json >/dev/null \
            || { echo '::error::o projeto não nasceu em modo runner'; cat projeto.json; exit 1; }

          # A cadência da espera é 15s/30s/60s e o último se repete (RN-550), e
          # este projeto pode ter nascido logo depois de um sono de 60s — daí o
          # teto de 240s. A linha é gravada ANTES de o agente tentar conectar,
          # então ela mede o que esta sessão promete (pegar o projeto) e não o
          # join, que depende do engine e é outra garantia.
          # Lido inteiro antes do `grep`, pelo motivo do passo "DE PÉ" (AT-242).
          ja_disse() {
            local journal
            journal="$(journalctl --user -u "$1" --no-pager 2>/dev/null)" || return 1
            grep -qF "$2" <<<"$journal"
          }
          limite=$(( SECONDS + 240 ))
          until ja_disse brabo-runner.service 'a espera ACABA'; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo '::error::o agente não pegou o projeto criado na web — a promessa da FASE 30 não se cumpriu'
              journalctl --user -u brabo-runner.service --no-pager || true
              exit 1
            fi
            sleep 5
          done
          echo 'o agente pegou o primeiro projeto sozinho — ninguém voltou ao terminal'

      # A idempotência da RN-547 vista do lado que o E2E alcança sem reinstalar:
      # a api RESPONDE 409 de verdade à segunda `first-account`. O que o
      # instalador FAZ com esse 409 (calar-se, e não virar pendência) é
      # classificação de código HTTP, coberta em `install-fechamento.spec.ts`
      # contra um servidor de teste — repeti-la aqui exigiria uma segunda
      # instalação inteira, que passa pelo caminho de MIGRAÇÃO (backup provado,
      # apagar, recriar) e é entrega própria, não um passo a mais.
      - name: A segunda conta é 409, e é a api de verdade dizendo isso
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          token="$(grep '^BRABO_SERVICE_TOKEN=' .env | cut -d= -f2-)"
          [ -n "$token" ] || { echo '::error::o .env não tem BRABO_SERVICE_TOKEN'; exit 1; }
          cfg="$(mktemp)"; chmod 600 "$cfg"
          {
            printf 'url = "http://localhost:3000/internal/first-account"\n'
            printf 'request = "POST"\n'
            printf 'header = "Content-Type: application/json"\n'
            printf 'header = "x-brabo-service-token: %s"\n' "$token"
            printf 'data-binary = "@-"\n'
            printf 'silent\n'
          } > "$cfg"
          # Senha gerada, e não uma constante: `exigirSenhaValida` roda ANTES do
          # 409 (a política é do domínio, chamada pelo mesmo código do registro
          # normal), então uma senha fraca daria 400 e o passo mediria a coisa
          # errada.
          E2E_SEGUNDA="$(openssl rand -base64 18)"
          export E2E_SEGUNDA
          echo "::add-mask::${E2E_SEGUNDA}"
          codigo="$(jq -n '{email: "segunda@example.com", senha: env.E2E_SEGUNDA}' \
            | curl -K "$cfg" -o /dev/null -w '%{http_code}')"
          rm -f "$cfg"
          [ "$codigo" = '409' ] \
            || { echo "::error::a segunda first-account respondeu ${codigo}, e 409 é o desfecho esperado"; exit 1; }

      # A MIGRAÇÃO (AT-738), que o E2E nunca exercitou: até aqui ele só provava a
      # máquina LIMPA, e foi por isso que a 1.0.0 saiu com a migração quebrada em
      # TODO Linux (backup sem permissão de escrita no uid do runner, Postgres
      # não restaurado, segredos regenerados que deixam as credenciais
      # ilegíveis, marcador não gravado, grafo vazio).
      #
      # Semeia dado de verdade pela api, guarda as contagens, roda o MESMO
      # instalador pelo MESMO driver de TTY, e confere o que tem de sobreviver.
      # Reinstalar a mesma tag é a relação `igual`: o caminho é o de sempre
      # (backup, prova, apagar, recriar, restaurar) e a pergunta é a dela.
      #
      # Este passo FALHA contra o `install.sh` que não consertou a migração, e é
      # isso que ele prova. Como o workflow só roda em tag, o verde ou o vermelho
      # real vem na tag; em PR, `scripts/dev/install-e2e.spec.ts` reprova o passo
      # que sumir ou deixar de conferir contagem, credencial, marcador, grafo,
      # `brabo_restore_test` e o dono da pasta de backup.
      - name: Migração com dado semeado — contagens, credencial, marcador, grafo e backup
        if: runner.os == 'Linux'
        env:
          TAG: ${{ steps.alvo.outputs.tag }}
        run: |
          set -euo pipefail
          api='http://localhost:3000'
          estado="${XDG_STATE_HOME:-$HOME/.local/state}/brabo/install-state.json"
          dc() { docker compose -f docker/docker-compose.install.yml --env-file .env "$@"; }
          sql() { dc exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$1"' _ "$1"; }
          repos_bare() { dc exec -T api sh -c "find /data/git-repos -maxdepth 1 -name '*.git' | wc -l" | tr -d '[:space:]'; }
          nos_do_grafo() {
            dc exec -T neo4j sh -c 'cypher-shell -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_AUTH#*/}" --format plain "MATCH (n) RETURN count(n)"' \
              | tail -n 1 | tr -d '[:space:]'
          }

          # --- 1. Semear: conta (já existe), projeto com repositório LOCAL, sessão
          # com eventos e UMA credencial de LLM falsa, cifrada pela própria api.
          E2E_EMAIL="$(sed -n 1p "${RUNNER_TEMP}/credencial")"
          E2E_SENHA="$(sed -n 2p "${RUNNER_TEMP}/credencial")"
          export E2E_EMAIL E2E_SENHA
          echo "::add-mask::${E2E_SENHA}"
          token="$(jq -n '{email: env.E2E_EMAIL, senha: env.E2E_SENHA}' \
            | curl -fsS -X POST "${api}/auth/login" -H 'Content-Type: application/json' --data-binary @- \
            | jq -r '.accessToken')"
          [ -n "$token" ] && [ "$token" != 'null' ] || { echo '::error::login do dono falhou antes da migração'; exit 1; }
          echo "::add-mask::${token}"
          chamar() { curl -fsS -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' "$@"; }

          ws="$(chamar "${api}/workspaces" | jq -r '.[0].workspace.id')"
          projeto="$(jq -n '{name: "Migracao E2E", slug: "migracao-e2e"}' \
            | chamar -X POST "${api}/workspaces/${ws}/projects" --data-binary @- | jq -r '.id')"
          [ -n "$projeto" ] && [ "$projeto" != 'null' ] || { echo '::error::não semeei o projeto da migração'; exit 1; }
          jq -n '{name: "migracao-e2e", visibility: "private"}' \
            | chamar -X POST "${api}/projects/${projeto}/git/local/repository" --data-binary @- >/dev/null \
            || { echo '::error::não semeei o repositório local (bare) do projeto'; exit 1; }
          sessao="$(jq -n '{kind: "consultiva", name: "Sessao da migracao"}' \
            | chamar -X POST "${api}/projects/${projeto}/sessions" --data-binary @- | jq -r '.id')"
          [ -n "$sessao" ] && [ "$sessao" != 'null' ] || { echo '::error::não semeei a sessão da migração'; exit 1; }
          for n in 1 2 3; do
            jq -n --arg c "mensagem ${n} da migracao" \
              '{type: "chat.message", actor: {kind: "system", id: "e2e"}, payload: {role: "user", content: $c}}' \
              | chamar -X POST "${api}/projects/${projeto}/sessions/${sessao}/events" --data-binary @- >/dev/null
          done
          # A chave falsa é GERADA aqui; ela só precisa ser cifrada e decifrada.
          chave_falsa="sk-or-v1-falsa-$(openssl rand -hex 16)"
          echo "::add-mask::${chave_falsa}"
          jq -n --arg k "$chave_falsa" '{provider: "openrouter", apiKey: $k}' \
            | chamar -X POST "${api}/users/me/credentials" --data-binary @- >/dev/null \
            || { echo '::error::a api não gravou a credencial semeada'; exit 1; }

          # --- 2. Guardar o que tem de sobreviver.
          antes="${RUNNER_TEMP}/contagens-antes.txt"
          {
            echo "users $(sql 'select count(*) from users')"
            echo "projects $(sql 'select count(*) from projects')"
            echo "sessions $(sql 'select count(*) from sessions')"
            echo "session_events $(sql 'select count(*) from session_events')"
            echo "bare_repos $(repos_bare)"
          } | tee "$antes"
          awk '$2 < 1 { bad=1 } END { exit bad }' "$antes" \
            || { echo '::error::a semeadura não deixou dado em alguma das cinco contagens — a prova seria vazia'; exit 1; }

          # --- 3. Migrar: o MESMO instalador, o MESMO driver de TTY. A ordem é a
          # da máquina com marcador: a pergunta de migração, a de apagar/restaurar
          # (`s`), e depois as da máquina limpa. A conta já existe e volta pelo
          # restore; o instalador a trata como 409 (RN-547), sem pendência.
          respostas="${RUNNER_TEMP}/respostas-migracao.json"
          E2E_SENHA="$E2E_SENHA" E2E_EMAIL="$E2E_EMAIL" E2E_BASE="${HOME}/projetos-brabo" \
            jq -n '[
              {espera: "Reinstalar do zero mesmo assim", resposta: "s"},
              {espera: "Apagar os volumes e reinstalar?", resposta: "s"},
              {espera: "Gravar o marcador de instalação", resposta: "s"},
              {espera: "Base [", resposta: env.E2E_BASE},
              {espera: "Ligar o broker de container? [s/N] ", resposta: "s"},
              {espera: "Ligar os modelos locais? [s/N] ", resposta: "n"},
              {espera: "Criar a primeira conta agora?", resposta: "s"},
              {espera: "E-mail: ", resposta: env.E2E_EMAIL},
              {espera: "Senha (não aparece na tela): ", resposta: env.E2E_SENHA, segredo: true},
              {espera: "Repita a senha: ", resposta: env.E2E_SENHA, segredo: true},
              {espera: "Nome (opcional, Enter para pular): ", resposta: ""}
            ]' > "$respostas"
          chmod 600 "$respostas"
          codigo=0
          NO_COLOR=1 python3 -I "${RUNNER_TEMP}/terminal-do-e2e.py" "$respostas" bash install.sh --source=ghcr \
            > migracao.txt || codigo=$?
          rm -f "$respostas"
          cat migracao.txt
          [ "$codigo" -eq 0 ] \
            || { echo "::error::a migração terminou com código ${codigo} (3/4 = o driver do TTY parou)"; exit 1; }

          exigir() { grep -qF -- "$2" migracao.txt || { echo "::error::$1 (não achei na saída: $2)"; exit 1; }; }
          exigir 'o backup não foi provado antes de apagar' 'backup provado'
          exigir 'os volumes não foram removidos' 'volumes removidos'
          exigir 'os repositórios git não foram restaurados' 'repositórios git restaurados'
          if grep -qF 'O que ficou pendente' migracao.txt; then
            echo '::error::a migração terminou com pendências'
            sed -n '/O que ficou pendente/,$p' migracao.txt
            exit 1
          fi

          # --- 4. Conferir.
          # (a) contagens e bare repos IGUAIS: o Postgres tem de voltar sozinho.
          depois="${RUNNER_TEMP}/contagens-depois.txt"
          {
            echo "users $(sql 'select count(*) from users')"
            echo "projects $(sql 'select count(*) from projects')"
            echo "sessions $(sql 'select count(*) from sessions')"
            echo "session_events $(sql 'select count(*) from session_events')"
            echo "bare_repos $(repos_bare)"
          } > "$depois"
          diff -u "$antes" "$depois" \
            || { echo '::error::as contagens (ou os repositórios bare) depois da migração diferem das de antes'; exit 1; }

          # (b) a credencial semeada ainda DECIFRA. A api decifra para testar: se a
          # chave mestra mudou, `decrypt` lança e a rota responde 5xx (`curl -f`
          # reprova). Com a chave falsa o desfecho é `recusado` — o que vale é ter
          # chegado ao provider com o texto claro, nunca o erro de autenticação.
          token="$(jq -n '{email: env.E2E_EMAIL, senha: env.E2E_SENHA}' \
            | curl -fsS -X POST "${api}/auth/login" -H 'Content-Type: application/json' --data-binary @- \
            | jq -r '.accessToken')"
          [ -n "$token" ] && [ "$token" != 'null' ] || { echo '::error::o dono não entra depois da migração'; exit 1; }
          echo "::add-mask::${token}"
          teste="$(curl -sS -X POST -H "Authorization: Bearer ${token}" -w '\n%{http_code}' \
            "${api}/users/me/credentials/openrouter/test")"
          [ "$(tail -n 1 <<<"$teste")" = '200' ] \
            || { echo '::error::a credencial semeada NÃO decifra depois da migração (a chave mestra mudou?)'; echo "$teste"; exit 1; }
          if grep -qiE 'unable to authenticate|unsupported state' <<<"$teste"; then
            echo '::error::a credencial semeada NÃO decifra depois da migração: unable to authenticate data'
            echo "$teste"; exit 1
          fi

          # (c) o marcador registra a versão instalada.
          [ "$(jq -r '.versao' "$estado")" = "${TAG#v}" ] \
            || { echo "::error::o marcador não registra a versão ${TAG#v}"; cat "$estado"; exit 1; }

          # (d) o grafo foi reprojetado. A projeção é assíncrona: espera com teto.
          limite=$(( SECONDS + 120 ))
          until [ "$(nos_do_grafo || echo 0)" -gt 0 ] 2>/dev/null; do
            if [ "$SECONDS" -ge "$limite" ]; then
              echo '::error::o grafo ficou com 0 nós depois da migração — a reprojeção não aconteceu'
              exit 1
            fi
            sleep 5
          done

          # (e) a database de prova da restauração não sobra.
          [ "$(sql "select count(*) from pg_database where datname = 'brabo_restore_test'" | tr -d '[:space:]')" = '0' ] \
            || { echo '::error::sobrou a database brabo_restore_test'; exit 1; }

          # (f) a pasta de backup é do uid do RUNNER, com tudo o que o container
          # gravou nela: a imagem de backup roda como 70:70 por padrão, e uma
          # pasta do uid 1001 não aceitava escrita dela.
          mapfile -t pastas < <(compgen -G 'brabo-backup-*' || true)
          [ "${#pastas[@]}" -eq 1 ] \
            || { echo "::error::esperava UMA pasta brabo-backup-*, achei ${#pastas[@]}"; exit 1; }
          [ "$(stat -c '%u' "${pastas[0]}")" = "$(id -u)" ] \
            || { echo "::error::a pasta de backup não é do uid do runner ($(id -u))"; exit 1; }
          intrusos="$(find "${pastas[0]}" ! -user "$(id -u)" | head -5)"
          [ -z "$intrusos" ] \
            || { echo "::error::há arquivos no backup que não são do uid do runner:"; echo "$intrusos"; exit 1; }
          [ -n "$(find "${pastas[0]}" -type f | head -1)" ] \
            || { echo '::error::a pasta de backup está vazia'; exit 1; }

      - name: O que ficou de pé
        if: always() && runner.os == 'Linux'
        run: |
          docker compose -f docker/docker-compose.install.yml ps 2>/dev/null || true
          systemctl --user status brabo-runner.service --no-pager --full 2>/dev/null || true
          journalctl --user -u brabo-runner.service --no-pager 2>/dev/null | tail -60 || true
