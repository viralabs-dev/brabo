name: ci

# Actionlint e pins do brabo-ci (AT-819, ADR 0280). Não é check obrigatório.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
    with:
      ci_ref: 62f6d3405a08216dd1054704c4c871c75e8ec9b6  # v1.5.0-dev.1
