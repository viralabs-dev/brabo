name: ci

# Actionlint e pins do brabo-ci (AT-819, ADR 0280). Não é check obrigatório.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
    with:
      ci_ref: 6390ef56b6c405db9a24956bf41c55a7ea601612  # v1.4.0-dev.17
