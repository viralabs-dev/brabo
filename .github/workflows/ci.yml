name: ci

# Actionlint e pins do brabo-ci (AT-819, ADR 0280). Não é check obrigatório.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@0a9eba831fb82b9a20a5ad03bc2273a3ede69796  # v1.4.0-dev.5
    with:
      ci_ref: 0a9eba831fb82b9a20a5ad03bc2273a3ede69796  # v1.4.0-dev.5
