name: ci

# Actionlint e pins do brabo-ci (AT-819, ADR 0280). Não é check obrigatório.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
    with:
      ci_ref: a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
