name: ci

# Actionlint e pins do brabo-ci (AT-819, ADR 0280). Não é check obrigatório.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadeia:
    name: Cadeia (actionlint e pins)
    uses: viralabs-dev/brabo-ci/.github/workflows/cadeia.yml@22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
    with:
      ci_ref: 22a5cd0d38add52f53b7f58cfd43740459cae68a  # v1.5.0
